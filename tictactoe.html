<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tic Tac Toe</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #1a1a2e;
      color: #eee;
      font-family: 'Segoe UI', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }

    h1 {
      font-size: 2.5rem;
      margin-bottom: 1rem;
      letter-spacing: 3px;
      color: #e94560;
    }

    #status {
      font-size: 1.2rem;
      margin-bottom: 1.5rem;
      min-height: 1.5rem;
      color: #a0a0c0;
    }

    #status.winner { color: #4ecca3; font-weight: bold; }
    #status.draw   { color: #f0a500; font-weight: bold; }

    #board {
      display: grid;
      grid-template-columns: repeat(3, 110px);
      grid-template-rows: repeat(3, 110px);
      gap: 8px;
    }

    .cell {
      background: #16213e;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 3rem;
      cursor: pointer;
      transition: background 0.15s, transform 0.1s;
      user-select: none;
    }

    .cell:hover:not(.taken) { background: #0f3460; transform: scale(1.04); }
    .cell.taken { cursor: default; }
    .cell.x { color: #e94560; }
    .cell.o { color: #4ecca3; }
    .cell.win { background: #0f3460; outline: 3px solid #4ecca3; }

    #controls {
      display: flex;
      gap: 12px;
      margin-top: 1.8rem;
      flex-wrap: wrap;
      justify-content: center;
    }

    button {
      padding: 0.6rem 1.4rem;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      cursor: pointer;
      transition: opacity 0.15s;
    }

    button:hover { opacity: 0.85; }

    #restart { background: #e94560; color: #fff; }

    #mode-btn { background: #4ecca3; color: #1a1a2e; font-weight: bold; }

    #score {
      margin-top: 1.5rem;
      display: flex;
      gap: 2rem;
      font-size: 1rem;
      color: #a0a0c0;
    }

    .score-item span { font-weight: bold; font-size: 1.3rem; }
    .score-item .x-score { color: #e94560; }
    .score-item .o-score { color: #4ecca3; }
  </style>
</head>
<body>

<h1>TIC TAC TOE</h1>
<div id="status">X's turn</div>

<div id="board">
  <div class="cell" data-i="0"></div>
  <div class="cell" data-i="1"></div>
  <div class="cell" data-i="2"></div>
  <div class="cell" data-i="3"></div>
  <div class="cell" data-i="4"></div>
  <div class="cell" data-i="5"></div>
  <div class="cell" data-i="6"></div>
  <div class="cell" data-i="7"></div>
  <div class="cell" data-i="8"></div>
</div>

<div id="controls">
  <button id="restart">Restart</button>
  <button id="mode-btn">vs CPU</button>
</div>

<div id="score">
  <div class="score-item">X <span class="x-score" id="x-score">0</span></div>
  <div class="score-item">Draws <span id="d-score">0</span></div>
  <div class="score-item">O <span class="o-score" id="o-score">0</span></div>
</div>

<script>
  const WINS = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];

  let board, current, gameOver, vsCPU;
  let scores = { X: 0, O: 0, D: 0 };

  const cells    = document.querySelectorAll('.cell');
  const status   = document.getElementById('status');
  const modeBtn  = document.getElementById('mode-btn');
  const xScoreEl = document.getElementById('x-score');
  const oScoreEl = document.getElementById('o-score');
  const dScoreEl = document.getElementById('d-score');

  vsCPU = false;

  function init() {
    board    = Array(9).fill(null);
    current  = 'X';
    gameOver = false;
    cells.forEach(c => { c.textContent = ''; c.className = 'cell'; });
    status.textContent = "X's turn";
    status.className   = '';
  }

  function checkWinner(b) {
    for (const [a, x, y] of WINS) {
      if (b[a] && b[a] === b[x] && b[a] === b[y]) return { winner: b[a], line: [a, x, y] };
    }
    return b.includes(null) ? null : { winner: null };
  }

  function applyMove(i) {
    board[i] = current;
    const cell = cells[i];
    cell.textContent = current;
    cell.classList.add('taken', current.toLowerCase());

    const result = checkWinner(board);
    if (result) {
      gameOver = true;
      if (result.winner) {
        result.line.forEach(idx => cells[idx].classList.add('win'));
        status.textContent = `${result.winner} wins!`;
        status.className   = 'winner';
        scores[result.winner]++;
      } else {
        status.textContent = "It's a draw!";
        status.className   = 'draw';
        scores.D++;
      }
      updateScore();
      return;
    }
    current = current === 'X' ? 'O' : 'X';
    status.textContent = `${current}'s turn`;
  }

  function updateScore() {
    xScoreEl.textContent = scores.X;
    oScoreEl.textContent = scores.O;
    dScoreEl.textContent = scores.D;
  }

  // Minimax for unbeatable CPU
  function minimax(b, isMax) {
    const result = checkWinner(b);
    if (result) {
      if (result.winner === 'O') return  10;
      if (result.winner === 'X') return -10;
      return 0;
    }
    const scores = b.map((v, i) => {
      if (v !== null) return null;
      const nb = [...b];
      nb[i] = isMax ? 'O' : 'X';
      return minimax(nb, !isMax);
    });
    return isMax ? Math.max(...scores.filter(s => s !== null))
                 : Math.min(...scores.filter(s => s !== null));
  }

  function cpuMove() {
    let best = -Infinity, move = -1;
    board.forEach((v, i) => {
      if (v !== null) return;
      const nb = [...board]; nb[i] = 'O';
      const s = minimax(nb, false);
      if (s > best) { best = s; move = i; }
    });
    if (move !== -1) applyMove(move);
  }

  cells.forEach(cell => {
    cell.addEventListener('click', () => {
      const i = +cell.dataset.i;
      if (gameOver || board[i] || (vsCPU && current === 'O')) return;
      applyMove(i);
      if (!gameOver && vsCPU && current === 'O') {
        setTimeout(cpuMove, 300);
      }
    });
  });

  document.getElementById('restart').addEventListener('click', init);

  modeBtn.addEventListener('click', () => {
    vsCPU = !vsCPU;
    modeBtn.textContent = vsCPU ? 'vs Human' : 'vs CPU';
    init();
  });

  init();
</script>
</body>
</html>
